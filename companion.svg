<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="520" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF5588" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style><![CDATA[
    /* ================= TYPOGRAPHY ================= */
    .mono {
      font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    }
    .cyan   { fill: #00F0FF; }
    .green  { fill: #00FF66; }
    .amber  { fill: #FFB000; }
    .pink   { fill: #FF5588; }
    .muted  { fill: #6e7681; }
    .white  { fill: #e6edf3; }

    /* ================= PHASE 1: BOOT SEQUENCE (ONE-SHOT) ================= */
    .boot-layer {
      animation: bootFadeOut 3.0s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .boot-1 { opacity: 0; animation: lineShow 0.1s 0.2s forwards; }
    .boot-2 { opacity: 0; animation: lineShow 0.1s 0.9s forwards; }
    .boot-3 { opacity: 0; animation: lineShow 0.1s 1.6s forwards; }
    .boot-4 { opacity: 0; animation: lineShow 0.1s 2.2s forwards; }

    @keyframes lineShow {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes bootFadeOut {
      0%, 88% { opacity: 1; visibility: visible; }
      98%     { opacity: 0; }
      100%    { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    /* ================= PHASE 2: MAIN IDLE STATE (24s TOTAL LOOP) ================= */
    .main-layer {
      opacity: 0;
      animation: mainFadeIn 0.4s 2.9s forwards;
    }
    @keyframes mainFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Scene Visibility (4 Scenes x 6 Seconds = 24s Loop) */
    .scene-1 { animation: scene1 24s steps(1) infinite; }
    .scene-2 { animation: scene2 24s steps(1) infinite; }
    .scene-3 { animation: scene3 24s steps(1) infinite; }
    .scene-4 { animation: scene4 24s steps(1) infinite; }

    @keyframes scene1 {
      0%, 24.99% { opacity: 1; }
      25%, 100%  { opacity: 0; }
    }
    @keyframes scene2 {
      0%, 24.99% { opacity: 0; }
      25%, 49.99% { opacity: 1; }
      50%, 100%  { opacity: 0; }
    }
    @keyframes scene3 {
      0%, 49.99% { opacity: 0; }
      50%, 74.99% { opacity: 1; }
      75%, 100%  { opacity: 0; }
    }
    @keyframes scene4 {
      0%, 74.99% { opacity: 0; }
      75%, 99.99% { opacity: 1; }
      100%       { opacity: 0; }
    }

    /* ================= TYPING EFFECTS (6s PER SCENE) ================= */
    /* Command Typing in 6s loop */
    .type-cmd {
      animation: typeCommand 6s steps(22) infinite;
    }
    @keyframes typeCommand {
      0%       { clip-path: inset(0 100% 0 0); }
      25%, 92% { clip-path: inset(0 0% 0 0); }
      100%     { clip-path: inset(0 100% 0 0); }
    }

    /* Status Subtitle Typing (starts after command) */
    .type-status {
      animation: typeStatus 6s steps(30) infinite;
    }
    @keyframes typeStatus {
      0%, 28%  { clip-path: inset(0 100% 0 0); opacity: 1; }
      60%, 92% { clip-path: inset(0 0% 0 0); opacity: 1; }
      98%, 100%{ clip-path: inset(0 100% 0 0); opacity: 0; }
    }

    /* Sub-frames within scenes (Pet movements & Blinking) */
    .blink-s1 { animation: blinkS1 6s steps(1) infinite; }
    @keyframes blinkS1 {
      0%, 47.99%   { opacity: 0; }
      48%, 54.99%  { opacity: 1; }
      55%, 100%    { opacity: 0; }
    }
    .normal-s1 { animation: normalS1 6s steps(1) infinite; }
    @keyframes normalS1 {
      0%, 47.99%   { opacity: 1; }
      48%, 54.99%  { opacity: 0; }
      55%, 100%    { opacity: 1; }
    }

    /* Look Left / Look Right in Scene 2 */
    .look-left  { animation: lookL 6s steps(1) infinite; }
    .look-right { animation: lookR 6s steps(1) infinite; }
    @keyframes lookL {
      0%, 49.99% { opacity: 1; }
      50%, 100%  { opacity: 0; }
    }
    @keyframes lookR {
      0%, 49.99% { opacity: 0; }
      50%, 100%  { opacity: 1; }
    }

    /* Spotted / Wave in Scene 3 */
    .spot-pet { animation: spotP 6s steps(1) infinite; }
    .wave-pet { animation: waveP 6s steps(1) infinite; }
    @keyframes spotP {
      0%, 39.99% { opacity: 1; }
      40%, 100%  { opacity: 0; }
    }
    @keyframes waveP {
      0%, 39.99% { opacity: 0; }
      40%, 100%  { opacity: 1; }
    }

    /* Heart / Sleep in Scene 4 */
    .love-pet  { animation: loveP 6s steps(1) infinite; }
    .sleep-pet { animation: sleepP 6s steps(1) infinite; }
    @keyframes loveP {
      0%, 44.99% { opacity: 1; }
      45%, 100%  { opacity: 0; }
    }
    @keyframes sleepP {
      0%, 44.99% { opacity: 0; }
      45%, 100%  { opacity: 1; }
    }

    /* Cursor & Indicator Pulse */
    .cursor { animation: blinkCur 0.8s steps(1) infinite; }
    @keyframes blinkCur { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .pulse { animation: neonPulse 1.8s ease-in-out infinite alternate; }
    @keyframes neonPulse { 0% { opacity: 0.35; } 100% { opacity: 1; } }
  ]]></style>

  <!-- Card Window Box -->
  <rect x="2" y="2" width="516" height="176" rx="8" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Terminal Top Header -->
  <path d="M 2 8 A 6 6 0 0 1 8 2 L 512 2 A 6 6 0 0 1 518 8 L 518 28 L 2 28 Z" fill="#121826" />
  <line x1="2" y1="28" x2="518" y2="28" stroke="#1f293d" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="20" cy="15" r="4.5" fill="#FF5F56" />
  <circle cx="35" cy="15" r="4.5" fill="#FFBD2E" />
  <circle cx="50" cy="15" r="4.5" fill="#27C93F" />

  <!-- Header Title and Status -->
  <text x="260" y="19" text-anchor="middle" class="mono muted" font-size="11">stoy@cyberdeck:~ (zsh)</text>
  <circle cx="496" cy="15" r="3.5" fill="#00FF66" class="pulse" />

  <!-- ======================================================= -->
  <!-- PHASE 1: BOOT SEQUENCE LAYER (0.0s - 3.0s)             -->
  <!-- ======================================================= -->
  <g class="boot-layer mono" font-size="11" transform="translate(30, 56)">
    <g class="boot-1">
      <text x="0" y="0" class="muted">[0.02s]</text>
      <text x="55" y="0" class="cyan">&gt; [INIT]</text>
      <text x="110" y="0" class="white">Booting companion neural daemon...</text>
    </g>
    <g class="boot-2">
      <text x="0" y="25" class="muted">[0.45s]</text>
      <text x="55" y="25" class="amber">&gt; [LOAD]</text>
      <text x="110" y="25" class="white">Calibrating kaomoji emotion matrix...</text>
    </g>
    <g class="boot-3">
      <text x="0" y="50" class="muted">[0.98s]</text>
      <text x="55" y="50" class="cyan">&gt; [SYNC]</text>
      <text x="110" y="50" class="white">Handshake verified: @visitor session active</text>
    </g>
    <g class="boot-4">
      <text x="0" y="75" class="muted">[1.60s]</text>
      <text x="55" y="75" class="green">&gt; [READY]</text>
      <text x="110" y="75" class="green" font-weight="bold">Companion is awake! Launching live terminal...</text>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- PHASE 2: MAIN SCENES (24s TOTAL LOOP)                   -->
  <!-- ======================================================= -->
  <g class="main-layer">

    <!-- ================= SCENE 1: IDLE & CODING (0s - 6s) ================= -->
    <g class="scene-1">
      <!-- Pet Avatar -->
      <g transform="translate(260, 75)" text-anchor="middle" class="mono" font-size="24" font-weight="bold">
        <text x="0" y="0" class="green normal-s1">( ^ _ ^ )</text>
        <text x="0" y="0" class="green blink-s1">( - _ - )</text>
      </g>
      <!-- Typed Status Line -->
      <g transform="translate(260, 110)" text-anchor="middle" class="mono" font-size="11">
        <text x="0" y="0" class="type-status muted">&gt; status: <tspan class="green">all systems operational, coding...</tspan></text>
      </g>
      <!-- Typed Command Line -->
      <g transform="translate(25, 150)" class="mono" font-size="11">
        <text x="0" y="0" class="cyan">stoy@deck</text>
        <text x="75" y="0" class="muted">:</text>
        <text x="83" y="0" class="green">~</text>
        <text x="95" y="0" class="white type-cmd">$ check-status --verbose</text>
        <rect x="290" y="-10" width="7" height="12" fill="#00FF66" class="cursor" />
      </g>
    </g>

    <!-- ================= SCENE 2: SCANNING / LOOK AROUND (6s - 12s) ================= -->
    <g class="scene-2">
      <!-- Pet Avatar -->
      <g transform="translate(260, 75)" text-anchor="middle" class="mono" font-size="24" font-weight="bold">
        <text x="0" y="0" class="cyan look-left">( &lt; _ &lt; )</text>
        <text x="0" y="0" class="cyan look-right">( &gt; _ &gt; )</text>
      </g>
      <!-- Typed Status Line -->
      <g transform="translate(260, 110)" text-anchor="middle" class="mono" font-size="11">
        <text x="0" y="0" class="type-status muted">&gt; status: <tspan class="cyan">scanning for repository visitors...</tspan></text>
      </g>
      <!-- Typed Command Line -->
      <g transform="translate(25, 150)" class="mono" font-size="11">
        <text x="0" y="0" class="cyan">stoy@deck</text>
        <text x="75" y="0" class="muted">:</text>
        <text x="83" y="0" class="green">~</text>
        <text x="95" y="0" class="white type-cmd">$ scan-network --target=visitor</text>
        <rect x="345" y="-10" width="7" height="12" fill="#00F0FF" class="cursor" />
      </g>
    </g>

    <!-- ================= SCENE 3: SPOTTED & GREETING (12s - 18s) ================= -->
    <g class="scene-3">
      <!-- Pet Avatar -->
      <g transform="translate(260, 75)" text-anchor="middle" class="mono" font-size="24" font-weight="bold">
        <text x="0" y="0" class="amber spot-pet">( o _ o ) !?</text>
        <text x="0" y="0" class="green wave-pet">\( ^ o ^ )/</text>
      </g>
      <!-- Typed Status Line -->
      <g transform="translate(260, 110)" text-anchor="middle" class="mono" font-size="11">
        <text x="0" y="0" class="type-status muted">&gt; status: <tspan class="amber">yay! visitor detected, welcome! ✨</tspan></text>
      </g>
      <!-- Typed Command Line -->
      <g transform="translate(25, 150)" class="mono" font-size="11">
        <text x="0" y="0" class="cyan">stoy@deck</text>
        <text x="75" y="0" class="muted">:</text>
        <text x="83" y="0" class="green">~</text>
        <text x="95" y="0" class="white type-cmd">$ echo "Hello there, welcome to my GitHub!"</text>
        <rect x="425" y="-10" width="7" height="12" fill="#FFB000" class="cursor" />
      </g>
    </g>

    <!-- ================= SCENE 4: BLUSH & NAP (18s - 24s) ================= -->
    <g class="scene-4">
      <!-- Pet Avatar -->
      <g transform="translate(260, 75)" text-anchor="middle" class="mono" font-size="24" font-weight="bold">
        <text x="0" y="0" class="pink love-pet">( * &gt; _ &lt; * ) ♥</text>
        <text x="0" y="0" class="muted sleep-pet">( - . - ) z Z</text>
      </g>
      <!-- Typed Status Line -->
      <g transform="translate(260, 110)" text-anchor="middle" class="mono" font-size="11">
        <text x="0" y="0" class="type-status muted">&gt; status: <tspan class="pink">taking a coffee break... zzz</tspan></text>
      </g>
      <!-- Typed Command Line -->
      <g transform="translate(25, 150)" class="mono" font-size="11">
        <text x="0" y="0" class="cyan">stoy@deck</text>
        <text x="75" y="0" class="muted">:</text>
        <text x="83" y="0" class="green">~</text>
        <text x="95" y="0" class="white type-cmd">$ brew coffee &amp;&amp; take-a-nap</text>
        <rect x="330" y="-10" width="7" height="12" fill="#FF5588" class="cursor" />
      </g>
    </g>

    <!-- Terminal Footer Line Divider -->
    <line x1="20" y1="132" x2="500" y2="132" stroke="#1f293d" stroke-width="1" />

  </g>
</svg>
