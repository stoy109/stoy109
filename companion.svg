<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 165" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00FF66" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF5588" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    /* ================= GLOBAL TYPOGRAPHY ================= */
    .mono {
      font-family: ui-monospace, "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
    }
    .accent-cyan  { fill: #00F0FF; }
    .accent-green { fill: #00FF66; }
    .accent-amber { fill: #FFB000; }
    .accent-pink  { fill: #FF5588; }
    .muted        { fill: #6e7681; }

    /* ================= PHASE 1: BOOT SEQUENCE (ONE-SHOT) ================= */
    .boot-layer {
      animation: bootSequenceFade 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .boot-1 { opacity: 0; animation: bootLine 0.1s 0.2s forwards; }
    .boot-2 { opacity: 0; animation: bootLine 0.1s 0.8s forwards; }
    .boot-3 { opacity: 0; animation: bootLine 0.1s 1.4s forwards; }
    .boot-4 { opacity: 0; animation: bootLine 0.1s 2.0s forwards; }

    @keyframes bootLine {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes bootSequenceFade {
      0%, 88% { opacity: 1; visibility: visible; }
      98%     { opacity: 0; }
      100%    { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    /* ================= PHASE 2: MAIN IDLE STATE ================= */
    .main-layer {
      opacity: 0;
      animation: mainLayerFadeIn 0.4s 2.7s forwards;
    }
    @keyframes mainLayerFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Multi-Stage Animated Pet (12 Detik Loop) */
    .f1 { animation: a1 12s steps(1) infinite; }
    .f2 { animation: a2 12s steps(1) infinite; }
    .f3 { animation: a3 12s steps(1) infinite; }
    .f4 { animation: a4 12s steps(1) infinite; }
    .f5 { animation: a5 12s steps(1) infinite; }
    .f6 { animation: a6 12s steps(1) infinite; }
    .f7 { animation: a7 12s steps(1) infinite; }
    .f8 { animation: a8 12s steps(1) infinite; }

    /* 1. Idle Normal (0s - 1.8s) */
    @keyframes a1 { 0%, 14.99% { opacity: 1; } 15%, 100% { opacity: 0; } }
    /* 2. Kedip (1.8s - 2.2s) */
    @keyframes a2 { 0%, 14.99% { opacity: 0; } 15%, 17.99% { opacity: 1; } 18%, 100% { opacity: 0; } }
    /* 3. Lirik Kiri (2.2s - 4.0s) */
    @keyframes a3 { 0%, 17.99% { opacity: 0; } 18%, 32.99% { opacity: 1; } 33%, 100% { opacity: 0; } }
    /* 4. Lirik Kanan (4.0s - 5.8s) */
    @keyframes a4 { 0%, 32.99% { opacity: 0; } 33%, 47.99% { opacity: 1; } 48%, 100% { opacity: 0; } }
    /* 5. Kaget / Notice Visitor (5.8s - 7.5s) */
    @keyframes a5 { 0%, 47.99% { opacity: 0; } 48%, 62.99% { opacity: 1; } 63%, 100% { opacity: 0; } }
    /* 6. Melambai Tangan (7.5s - 9.2s) */
    @keyframes a6 { 0%, 62.99% { opacity: 0; } 63%, 76.99% { opacity: 1; } 77%, 100% { opacity: 0; } }
    /* 7. Blushing Love (9.2s - 10.8s) */
    @keyframes a7 { 0%, 76.99% { opacity: 0; } 77%, 89.99% { opacity: 1; } 90%, 100% { opacity: 0; } }
    /* 8. Tidur Pulas (10.8s - 12.0s) */
    @keyframes a8 { 0%, 89.99% { opacity: 0; } 90%, 99.99% { opacity: 1; } 100% { opacity: 0; } }

    /* Blinking Cursor & Neon Pulse */
    .cursor { animation: blink 0.8s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .pulse { animation: neonPulse 1.8s ease-in-out infinite alternate; }
    @keyframes neonPulse { 0% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>

  <!-- Card Window Box -->
  <rect x="2" y="2" width="456" height="161" rx="8" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Terminal Top Header -->
  <path d="M 2 8 A 6 6 0 0 1 8 2 L 452 2 A 6 6 0 0 1 458 8 L 458 26 L 2 26 Z" fill="#121826" />
  <line x1="2" y1="26" x2="458" y2="26" stroke="#1f293d" stroke-width="1" />

  <!-- Traffic Lights -->
  <circle cx="18" cy="14" r="4.5" fill="#FF5F56" />
  <circle cx="32" cy="14" r="4.5" fill="#FFBD2E" />
  <circle cx="46" cy="14" r="4.5" fill="#27C93F" />

  <!-- Header Title & Status -->
  <text x="230" y="17" text-anchor="middle" class="mono muted" font-size="11">pet_daemon.sh (zsh)</text>
  <circle cx="438" cy="14" r="3.5" fill="#00FF66" class="pulse" />

  <!-- ======================================================= -->
  <!-- PHASE 1: BOOT SEQUENCE LAYER (0.0s - 2.8s)             -->
  <!-- ======================================================= -->
  <g class="boot-layer mono" font-size="11" transform="translate(25, 48)">
    <g class="boot-1">
      <text x="0" y="0" class="muted">[0.02s]</text>
      <text x="55" y="0" class="accent-cyan">&gt; [INIT]</text>
      <text x="110" y="0" fill="#c9d1d9">Spawning terminal companion...</text>
    </g>
    <g class="boot-2">
      <text x="0" y="24" class="muted">[0.45s]</text>
      <text x="55" y="24" class="accent-amber">&gt; [LOAD]</text>
      <text x="110" y="24" fill="#c9d1d9">Mounting kaomoji emotion neural core...</text>
    </g>
    <g class="boot-3">
      <text x="0" y="48" class="muted">[0.98s]</text>
      <text x="55" y="48" class="accent-cyan">&gt; [AUTH]</text>
      <text x="110" y="48" fill="#c9d1d9">Handshake verified: @visitor detected</text>
    </g>
    <g class="boot-4">
      <text x="0" y="72" class="muted">[1.60s]</text>
      <text x="55" y="72" class="accent-green">&gt; [READY]</text>
      <text x="110" y="72" fill="#00FF66" font-weight="bold">Companion is now awake! ✨</text>
    </g>
  </g>

  <!-- ======================================================= -->
  <!-- PHASE 2: MAIN IDLE KAOMOJI STATE                       -->
  <!-- ======================================================= -->
  <g class="main-layer">
    
    <!-- PET AVATAR (8 Animated Expressions) -->
    <g transform="translate(230, 78)" text-anchor="middle" class="mono" font-size="22" font-weight="bold">
      <!-- 1. Normal Idle -->
      <text x="0" y="0" class="f1" fill="#00FF66">( ^ _ ^ )</text>
      
      <!-- 2. Blink -->
      <text x="0" y="0" class="f2" fill="#00FF66">( - _ - )</text>
      
      <!-- 3. Look Left -->
      <text x="0" y="0" class="f3" fill="#00F0FF">( &lt; _ &lt; )</text>
      
      <!-- 4. Look Right -->
      <text x="0" y="0" class="f4" fill="#00F0FF">( &gt; _ &gt; )</text>
      
      <!-- 5. Curious / Spotted Visitor -->
      <text x="0" y="0" class="f5" fill="#FFB000">( o _ o ) !?</text>
      
      <!-- 6. Wave Greeting -->
      <text x="0" y="0" class="f6" fill="#00FF66">\( ^ o ^ )/</text>
      
      <!-- 7. Love Blushing -->
      <text x="0" y="0" class="f7" fill="#FF5588">( * &gt; ᴗ &lt; * ) ♡</text>
      
      <!-- 8. Sleeping Nap -->
      <text x="0" y="0" class="f8" fill="#6e7681">( - . - ) z Z</text>
    </g>

    <!-- STATUS SUBTITLE DIALOG -->
    <g transform="translate(230, 114)" text-anchor="middle" class="mono" font-size="11">
      <text x="0" y="0" class="f1" fill="#8b949e">status: <tspan class="accent-green">idle &amp; vibing</tspan></text>
      <text x="0" y="0" class="f2" fill="#8b949e">status: <tspan class="accent-green">blinking...</tspan></text>
      <text x="0" y="0" class="f3" fill="#8b949e">status: <tspan class="accent-cyan">looking left &lt;--</tspan></text>
      <text x="0" y="0" class="f4" fill="#8b949e">status: <tspan class="accent-cyan">looking right --&gt;</tspan></text>
      <text x="0" y="0" class="f5" fill="#8b949e">status: <tspan class="accent-amber">spotted a visitor!</tspan></text>
      <text x="0" y="0" class="f6" fill="#8b949e">status: <tspan class="accent-green">welcome to my github!</tspan></text>
      <text x="0" y="0" class="f7" fill="#8b949e">status: <tspan class="accent-pink">have a great day! ✨</tspan></text>
      <text x="0" y="0" class="f8" fill="#8b949e">status: <tspan class="muted">taking a quick nap... zzz</tspan></text>
    </g>

    <!-- BOTTOM TERMINAL INTERACTION BAR -->
    <line x1="20" y1="134" x2="440" y2="134" stroke="#1f293d" stroke-width="1" />
    <g transform="translate(20, 149)" class="mono" font-size="10">
      <text x="0" y="0" class="accent-cyan">stoy@terminal</text>
      <text x="80" y="0" class="muted">:</text>
      <text x="88" y="0" class="accent-green">~</text>
      <text x="98" y="0" fill="#c9d1d9">$ git status --companion=online</text>
      <rect x="310" y="-9" width="6" height="11" fill="#00FF66" class="cursor" />
    </g>

  </g>
</svg>
